        .box { 
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 50px; 
            border-radius: 30px; 
            box-shadow: 0 24px 64px rgba(0,0,0,0.25); 
            text-align: center; 
            width: 370px;
            border: 1px solid rgba(255,255,255,0.6);

        .logo { 
            width: 100px; height: 100px; margin-bottom: 20px; 
            border-radius: 50%; object-fit: cover;
            border: 4px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);

            display: flex; align-items: center; justify-content: center; gap: 12px;
            padding: 14px; border: none; border-radius: 50px;
            text-decoration: none; color: white; font-weight: 600; 
            background: linear-gradient(45deg, #4285f4, #34a853); /* Google rəngləri */
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .google-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(66,133,244,0.3); }
    </style>
</head>
<body>
    <div class="box">
        <img src="logo.png" alt="Sətir.az" class="logo">
        <h2>Sətir.az</h2>
        <p>Giriş üçün Google hesabınızdan istifadə edin</p>
        <a href="/api/auth/google" class="google-btn">Google ilə davam et</a>
    </div>
</body>
